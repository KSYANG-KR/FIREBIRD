<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>불꽃새</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); background:#07041a; }
  html,body{ height:100%; margin:0; background:#07041a; overflow:hidden; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; outline:none; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const KF='"Black Han Sans","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
const PF='"Press Start 2P","Courier New",monospace';
try{ document.fonts.load('40px "Black Han Sans"'); document.fonts.load('20px "Press Start 2P"'); }catch(e){}

let W=0,H=0,DPR=1,L={};
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[(Math.random()*a.length)|0];
const easeOut=t=>1-Math.pow(1-t,3);
function hexRgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function rgba(h,a){const c=hexRgb(h);return`rgba(${c[0]},${c[1]},${c[2]},${a})`;}
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*DPR));c.height=Math.max(1,Math.ceil(h*DPR));const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);return{c,g,w,h};}
function ell(g,x,y,rx,ry,rot){g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);}

/* ================= glow sprites (pre-rendered once = fast) ================= */
const FW_COLORS=['#ffcf3f','#ff4057','#46ff8a','#44a8ff','#c66bff','#ff78d4','#eaf6ff','#ff8a2a'];
const GLOW={},SOFT={};let SMOKE=null;
(function buildGlows(){
  const S=64;
  FW_COLORS.concat(['#ffffff']).forEach(col=>{
    const [r,g2,b]=hexRgb(col);
    const a=document.createElement('canvas');a.width=a.height=S;const g=a.getContext('2d');
    let gr=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
    gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.16,`rgba(${r},${g2},${b},1)`);
    gr.addColorStop(0.42,`rgba(${r},${g2},${b},0.32)`);gr.addColorStop(1,`rgba(${r},${g2},${b},0)`);
    g.fillStyle=gr;g.fillRect(0,0,S,S);GLOW[col]=a;
    const s=document.createElement('canvas');s.width=s.height=S;const q=s.getContext('2d');
    gr=q.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
    gr.addColorStop(0,`rgba(${r},${g2},${b},0.6)`);gr.addColorStop(0.4,`rgba(${r},${g2},${b},0.2)`);gr.addColorStop(1,`rgba(${r},${g2},${b},0)`);
    q.fillStyle=gr;q.fillRect(0,0,S,S);SOFT[col]=s;
  });
  const m=document.createElement('canvas');m.width=m.height=S;const g=m.getContext('2d');
  const gr=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  gr.addColorStop(0,'rgba(150,140,175,0.7)');gr.addColorStop(0.5,'rgba(120,110,150,0.3)');gr.addColorStop(1,'rgba(100,90,130,0)');
  g.fillStyle=gr;g.fillRect(0,0,S,S);SMOKE=m;
})();
function glow(img,x,y,s,a){ctx.globalAlpha=a;ctx.drawImage(img,x-s/2,y-s/2,s,s);}

/* ================= birds ================= */
const BIRDS=[
  {id:'sparrow',name:'참새',scale:0.92,speed:0.66,hearts:2,flap:5.6,size:1,spd:3,feather:'#a8743f'},
  {id:'magpie',name:'까치',scale:1.08,speed:0.56,hearts:3,flap:4.3,size:2,spd:2,feather:'#17171f'},
  {id:'pigeon',name:'비둘기',scale:1.22,speed:0.47,hearts:4,flap:3.9,size:3,spd:1,feather:'#a9b3be'}
];
const OL='#140d1c';
const PAL={
  sparrow:{back:'#b07a44',backDark:'#6e4726',belly:'#ece2cd',streak:'#4a2e18',wing:'#94602f',wingDark:'#4f3119',wingBar:'#f6efdf',crown:'#8e4524',cheek:'#f8f3e8',spot:'#1b1410',beak:'#43352c',tail:'#5e3c20',eye:'#120c08'},
  magpie:{wing:'#15151c',wingPatch:'#f4f4f0',belly:'#f7f7f3',beak:'#101014',eye:'#0a0a0e'},
  pigeon:{back:'#aab4bf',backDark:'#79848f',belly:'#bac3cc',head:'#848f9b',neckA:'#3fbf8f',neckB:'#9d5cc4',wing:'#c0c9d2',bar:'#2a2d35',tail:'#96a0ab',band:'#2a2d35',beak:'#3a3a42',cere:'#f1ede6',iris:'#ff8a2a',eye:'#0a0a0e',foot:'#e0707e'}
};
function wingPath(g){g.beginPath();g.moveTo(1.5,0.5);g.bezierCurveTo(1,-5,-1.5,-10,-4.5,-13.5);g.bezierCurveTo(-7.5,-12.5,-10.5,-9,-11.5,-5.5);g.bezierCurveTo(-10,-2.5,-7,-0.5,-4,1.5);g.closePath();}
function drawWing(g,id,C,far){
  wingPath(g);g.fillStyle=C.wing;g.fill();
  g.save();wingPath(g);g.clip();
  if(id==='sparrow'){g.fillStyle=C.wingDark;ell(g,-8,-9.5,4.2,5.2,-0.5);g.fill();g.strokeStyle=C.wingBar;g.lineWidth=1.1;g.beginPath();g.moveTo(0.5,-4);g.quadraticCurveTo(-4,-5.2,-8.5,-3.2);g.stroke();}
  else if(id==='magpie'){g.fillStyle=C.wingPatch;ell(g,-7,-9.3,2.3,3.6,-0.55);g.fill();g.fillStyle='rgba(50,110,150,0.35)';ell(g,-2,-3,3,2.5);g.fill();}
  else{g.fillStyle='#98a3ae';ell(g,-7.5,-11,3.4,3.6,-0.5);g.fill();g.strokeStyle=C.bar;g.lineWidth=1.3;g.beginPath();g.moveTo(-0.5,-2.2);g.lineTo(-7.8,-1.3);g.moveTo(-1.6,-4.8);g.lineTo(-9,-3.6);g.stroke();}
  g.strokeStyle='rgba(0,0,0,0.25)';g.lineWidth=0.45;g.beginPath();
  g.moveTo(-3.5,-10.5);g.lineTo(-6.5,-6);g.moveTo(-6,-11.8);g.lineTo(-8.5,-6.5);g.moveTo(-8.5,-10.5);g.lineTo(-10,-6);g.stroke();
  if(far){g.fillStyle='rgba(12,6,24,0.4)';g.fillRect(-14,-16,18,20);}
  g.restore();
  wingPath(g);g.strokeStyle=OL;g.lineWidth=0.7;g.stroke();
}
function drawTail(g,id,C){
  g.beginPath();
  if(id==='sparrow'){g.moveTo(-7.5,-2);g.lineTo(-14.8,-3.8);g.quadraticCurveTo(-15.8,-1.3,-14.8,1.3);g.lineTo(-7.5,2.2);g.closePath();g.fillStyle=C.tail;g.fill();}
  else if(id==='magpie'){g.moveTo(-7.5,-1.8);g.lineTo(-27,-2.9);g.quadraticCurveTo(-29,-1,-27,0.9);g.lineTo(-7.5,2.2);g.closePath();
    const gr=g.createLinearGradient(-8,0,-28,0);gr.addColorStop(0,'#121218');gr.addColorStop(0.5,'#1d5d66');gr.addColorStop(1,'#1b2c4d');g.fillStyle=gr;g.fill();}
  else{g.moveTo(-7.5,-2);g.lineTo(-16.5,-3.6);g.quadraticCurveTo(-17.4,-0.9,-16.5,1.9);g.lineTo(-7.5,2.4);g.closePath();g.fillStyle=C.tail;g.fill();
    g.save();g.clip();g.fillStyle=C.band;g.fillRect(-18,-5,3,8);g.restore();}
  g.strokeStyle=OL;g.lineWidth=0.7;g.stroke();
}
function bodyPath(g,id){
  g.beginPath();
  if(id==='pigeon'){g.moveTo(9,-1);g.bezierCurveTo(9.5,-7.5,1,-8.5,-5,-5);g.bezierCurveTo(-8.5,-3.2,-10,-1.3,-10,0.2);g.bezierCurveTo(-8,3.2,-3,7.3,2.5,7.3);g.bezierCurveTo(7.5,7.3,9.5,4,9,-1);}
  else if(id==='magpie'){g.moveTo(8.5,-1.8);g.bezierCurveTo(8.5,-7,0,-7.5,-5,-4.6);g.bezierCurveTo(-8,-3,-9.8,-1.3,-9.8,0.2);g.bezierCurveTo(-8,2.6,-3.5,6,1.5,6);g.bezierCurveTo(6.5,6,9,3,8.5,-1.8);}
  else{g.moveTo(8.5,-1.5);g.bezierCurveTo(8.5,-7.5,0,-8.5,-5,-5.2);g.bezierCurveTo(-8,-3.5,-9.5,-1.5,-9.5,0);g.bezierCurveTo(-8,3,-3.5,7,1.5,7);g.bezierCurveTo(6.5,7,9,3.5,8.5,-1.5);}
  g.closePath();
}
function drawBody(g,id,C){
  bodyPath(g,id);
  const gr=g.createLinearGradient(0,-8,0,7);
  if(id==='magpie'){gr.addColorStop(0,'#24242e');gr.addColorStop(1,'#0e0e14');}else{gr.addColorStop(0,C.back);gr.addColorStop(1,C.backDark);}
  g.fillStyle=gr;g.fill();
  g.save();bodyPath(g,id);g.clip();
  if(id==='sparrow'){g.fillStyle=C.belly;ell(g,2,4.8,8.5,4.2,-0.05);g.fill();g.strokeStyle=C.streak;g.lineWidth=0.7;g.beginPath();for(let i=0;i<4;i++){g.moveTo(-5+i*2.2,-5.2+i*0.2);g.lineTo(-6.2+i*2.2,-2.5);}g.stroke();}
  else if(id==='magpie'){g.fillStyle=C.belly;ell(g,-1.6,3.4,6.4,3.3,-0.08);g.fill();ell(g,0.5,-3.3,3.8,1.35,-0.12);g.fill();g.fillStyle='rgba(50,110,150,0.3)';ell(g,3,-5,4,2.2);g.fill();}
  else{g.fillStyle=C.belly;ell(g,1.5,4.5,7,3.2);g.fill();const ng=g.createLinearGradient(3,-6,6,1);ng.addColorStop(0,C.neckA);ng.addColorStop(1,C.neckB);g.globalAlpha=0.85;g.fillStyle=ng;ell(g,5.4,-2.4,3.9,3.5,0.3);g.fill();g.globalAlpha=1;}
  g.fillStyle='rgba(255,255,255,0.18)';ell(g,2,-5,5,1.8,-0.1);g.fill();
  g.restore();
  bodyPath(g,id);g.strokeStyle=OL;g.lineWidth=0.75;g.stroke();
  if(id==='pigeon'){g.fillStyle=C.foot;ell(g,0.5,7.3,1.5,0.8);g.fill();g.stroke();}
}
function drawHead(g,id,C){
  let hx,hy,hr;
  if(id==='sparrow'){hx=6.4;hy=-4.8;hr=5.3;}else if(id==='magpie'){hx=6.6;hy=-4.4;hr=4.6;}else{hx=6.8;hy=-5.3;hr=4.0;}
  g.beginPath();g.arc(hx,hy,hr,0,Math.PI*2);
  if(id==='sparrow')g.fillStyle=C.cheek;
  else if(id==='magpie'){const gr=g.createRadialGradient(hx-1,hy-2,0.5,hx,hy,hr);gr.addColorStop(0,'#2f3b4e');gr.addColorStop(1,'#101016');g.fillStyle=gr;}
  else g.fillStyle=C.head;
  g.fill();
  g.save();g.beginPath();g.arc(hx,hy,hr,0,Math.PI*2);g.clip();
  if(id==='sparrow'){g.fillStyle=C.crown;ell(g,hx-1,hy-3.1,hr*1.08,hr*0.72);g.fill();ell(g,hx-4.2,hy-0.5,2.6,3.5);g.fill();g.fillStyle=C.spot;ell(g,hx-0.7,hy+1.3,1.35,1.1);g.fill();ell(g,hx+3.2,hy+4,2.3,1.8);g.fill();}
  else if(id==='pigeon'){const ng=g.createLinearGradient(hx-3,hy+1,hx,hy+5);ng.addColorStop(0,C.neckA);ng.addColorStop(1,C.neckB);g.globalAlpha=0.8;g.fillStyle=ng;ell(g,hx-1.5,hy+3.6,3.5,2.2);g.fill();g.globalAlpha=1;}
  g.fillStyle='rgba(255,255,255,0.2)';ell(g,hx-1.2,hy-2.6,2.2,1.1,-0.3);g.fill();
  g.restore();
  g.beginPath();g.arc(hx,hy,hr,0,Math.PI*2);g.strokeStyle=OL;g.lineWidth=0.75;g.stroke();
  g.beginPath();
  if(id==='sparrow'){g.moveTo(hx+hr*0.8,hy-0.7);g.lineTo(hx+hr*1.42,hy+0.35);g.lineTo(hx+hr*0.8,hy+1.3);}
  else if(id==='magpie'){g.moveTo(hx+hr*0.8,hy-1);g.lineTo(hx+hr*1.95,hy+0.15);g.lineTo(hx+hr*0.8,hy+1.1);}
  else{g.moveTo(hx+hr*0.88,hy-0.2);g.lineTo(hx+hr*1.65,hy+0.65);g.lineTo(hx+hr*0.88,hy+1.2);}
  g.closePath();g.fillStyle=C.beak;g.fill();g.stroke();
  if(id==='pigeon'){g.fillStyle=C.cere;ell(g,hx+hr*1.02,hy-0.1,0.9,0.55);g.fill();}
  const ex=hx+hr*0.4,ey=hy-hr*0.2;
  if(id==='pigeon'){g.fillStyle=C.iris;g.beginPath();g.arc(ex,ey,1.25,0,7);g.fill();g.fillStyle=C.eye;g.beginPath();g.arc(ex+0.15,ey,0.6,0,7);g.fill();}
  else{g.fillStyle=C.eye;g.beginPath();g.arc(ex,ey,1.35,0,7);g.fill();if(id==='magpie'){g.strokeStyle='#50506a';g.lineWidth=0.35;g.stroke();}}
  g.fillStyle='#fff';g.beginPath();g.arc(ex+0.45,ey-0.5,0.5,0,7);g.fill();
  if(id!=='magpie'){g.fillStyle='rgba(255,120,140,0.35)';ell(g,hx+hr*0.25,hy+hr*0.38,1.2,0.65);g.fill();}
}
function drawBirdShape(g,sp,phase,glide){
  const id=sp.id,C=PAL[id];
  const ang=glide?-1.15:0.25-(Math.sin(phase)*0.5+0.5)*2.35;
  g.lineJoin='round';g.lineCap='round';
  g.save();g.translate(-0.8,-2.8);g.rotate(ang+0.12);g.scale(0.86,0.86);drawWing(g,id,C,true);g.restore();
  drawTail(g,id,C);
  drawBody(g,id,C);
  g.save();g.translate(0.2,-2);g.rotate(ang);drawWing(g,id,C,false);g.restore();
  drawHead(g,id,C);
}
const kOf=sp=>H*0.0046*sp.scale;

/* ================= caches: sky, city, people ================= */
let SKY,VIG,FAR,NEAR,TW=[],PEOPLE={front:[],back:[]},CROWD={},BUF;
function buildSky(){
  SKY=mk(W,H);const g=SKY.g;
  const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#05031a');gr.addColorStop(0.45,'#120a3a');gr.addColorStop(0.72,'#2a1454');gr.addColorStop(0.88,'#4a1d5c');gr.addColorStop(1,'#6a2a5a');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  const hg=g.createLinearGradient(0,H*0.6,0,H*0.95);hg.addColorStop(0,'rgba(255,120,80,0)');hg.addColorStop(1,'rgba(255,120,90,0.22)');
  g.fillStyle=hg;g.fillRect(0,H*0.6,W,H*0.4);
  for(let i=0;i<170;i++){const y=Math.pow(Math.random(),1.4)*H*0.62;g.fillStyle=`rgba(255,255,255,${rand(0.2,0.85)*(1-y/(H*0.8))})`;const s=rand(0.6,1.8);g.fillRect(Math.random()*W,y,s,s);}
  const mx=W*0.86,my=H*0.15,mr=H*0.042;
  let mg=g.createRadialGradient(mx,my,mr*0.8,mx,my,mr*3.2);mg.addColorStop(0,'rgba(255,245,210,0.25)');mg.addColorStop(1,'rgba(255,245,210,0)');
  g.fillStyle=mg;g.fillRect(mx-mr*4,my-mr*4,mr*8,mr*8);
  mg=g.createRadialGradient(mx-mr*0.3,my-mr*0.3,mr*0.1,mx,my,mr);mg.addColorStop(0,'#fffdf2');mg.addColorStop(1,'#e8dca6');
  g.fillStyle=mg;g.beginPath();g.arc(mx,my,mr,0,7);g.fill();
  g.fillStyle='rgba(180,165,120,0.25)';[[-0.3,-0.2,0.22],[0.3,0.25,0.16],[0.1,-0.45,0.1]].forEach(c=>{g.beginPath();g.arc(mx+c[0]*mr,my+c[1]*mr,c[2]*mr,0,7);g.fill();});
  TW=[];for(let i=0;i<28;i++)TW.push({x:Math.random()*W,y:Math.random()*H*0.5,p:Math.random()*7,s:rand(1.2,2.4)});
  VIG=mk(W,H);const v=VIG.g;const vg=v.createRadialGradient(W/2,H*0.45,Math.min(W,H)*0.45,W/2,H*0.45,Math.max(W,H)*0.8);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.45)');v.fillStyle=vg;v.fillRect(0,0,W,H);
}
function buildStrip(stripW,minH,maxH,body,edge,wins,chance,far){
  const hgt=maxH+H*0.1;const s=mk(stripW,hgt);const g=s.g;let x=0;
  while(x<stripW){
    let w=rand(H*0.07,H*0.16);if(x+w>stripW)w=stripW-x;if(w<H*0.025)break;
    const h=rand(minH,maxH),top=hgt-h;
    g.fillStyle=body;g.fillRect(x,top,w,h);
    g.fillStyle=edge;g.fillRect(x,top,Math.max(1,w*0.07),h);
    const r=Math.random();
    if(r<0.2){g.fillStyle=body;g.fillRect(x+w*0.5-1,top-H*0.035,2,H*0.035);g.fillStyle=far?'rgba(255,80,80,0.5)':'#ff4d4d';g.beginPath();g.arc(x+w*0.5,top-H*0.036,Math.max(1.2,H*0.003),0,7);g.fill();}
    else if(r<0.38){g.fillStyle=body;g.fillRect(x+w*0.2,top-H*0.02,w*0.6,H*0.02);}
    else if(r<0.48){g.fillStyle=body;g.beginPath();g.moveTo(x+w*0.15,top);g.lineTo(x+w*0.5,top-H*0.04);g.lineTo(x+w*0.85,top);g.fill();}
    const ws=H*0.011,gap=H*0.021;
    for(let yy=top+gap*0.7;yy<hgt-gap*0.4;yy+=gap)for(let xx=x+gap*0.6;xx<x+w-ws-2;xx+=gap){if(Math.random()<chance){g.fillStyle=pick(wins);g.fillRect(xx,yy,ws,ws*1.25);}}
    x+=w+rand(0,H*0.012);
  }
  if(far){const tx=stripW*0.55,base=hgt,th=H*0.26;g.fillStyle=body;g.fillRect(tx-H*0.006,base-th,H*0.012,th);
    g.fillRect(tx-H*0.022,base-th*0.78,H*0.044,H*0.02);ell(g,tx,base-th*0.8,H*0.03,H*0.012);g.fill();g.fillRect(tx-1,base-th-H*0.05,2,H*0.05);
    g.fillStyle='rgba(255,210,140,0.7)';for(let i=0;i<5;i++)g.fillRect(tx-H*0.018+i*H*0.008,base-th*0.78+H*0.006,H*0.004,H*0.005);}
  return s;
}
function buildCity(){
  const sw=Math.max(W*1.4,1400);
  FAR=buildStrip(sw,H*0.06,H*0.19,'#2c2355','#3a2f6a',['rgba(255,210,140,0.5)','rgba(200,220,255,0.4)'],0.28,true);
  NEAR=buildStrip(sw,H*0.04,H*0.13,'#160e2d','#231944',['#ffd98a','#ffe9b8','#9fd4ff','#ffb46b'],0.4,false);
}
const SHIRTS=['#ff4a5a','#ffb03a','#ffe14a','#4fe07a','#3ec8ff','#4a7cff','#b96bff','#ff6fc8','#ffffff','#2ee6c0','#ff7a3a','#8aff4a'];
const SKINS=['#f6cfaa','#e8b48a','#c68b5e','#8d5a3b'];
const HAIRS=['#1a1414','#2b1d15','#4a2e1c','#7a4a2a','#d9a84a','#ff6fa0','#1a1414','#2b1d15'];
function buildPerson(shirt,skin,hair,dark,ph){
  const bw=ph*0.56,cw=bw*1.3,cx=cw/2,frames=[];
  const poses=[
    [[0.4,0.72,0.06,0.52],[0.4,0.72,0.06,0.52]],
    [[0.38,0.44,0.46,0.24],[0.38,0.44,0.46,0.24]],
    [[0.33,0.36,0.3,0.07],[0.33,0.36,0.3,0.07]],
    [[0.4,0.46,0.44,0.26],[0.36,0.42,0.3,0.14]]
  ];
  for(let f=0;f<4;f++){
    const s=mk(cw,ph),g=s.g,lw=Math.max(1,bw*0.05),aw=bw*0.15;
    g.lineCap='round';g.lineJoin='round';
    const sy=ph*0.6;

function radiusFor(t){return t==='big'?H*rand(0.15,0.165):t==='ring'?H*rand(0.12,0.135):t==='mini'?H*rand(0.065,0.075):H*rand(0.085,0.105);}
function makeFW(type,tx,ty,R,o){

  const col=o.col||pick(FW_COLORS);let col2=pick(FW_COLORS);if(Math.random()<0.45)col2=col;
  const n=type==='big'?60:type==='ring'?44:type==='mini'?26:40;const rays=[];
  for(let i=0;i<n;i++)rays.push({a:i/n*Math.PI*2+rand(-0.05,0.05),reach:type==='ring'?1:rand(0.9,1),seed:Math.random()*100});
  const delay=o.delay||0;
  return{type,x:tx+worldSpeed*(tele+delay),y:ty,R,rc:0,al:1,col,col2,tele,t:-delay,rays,deco,burst:false,active:false,resolved:false,near:false,hitBird:false,band:H*0.028,launchY:L.cityBase-rand(0,H*0.05)};

function spawnAt(type,aimed,deco){const R=radiusFor(type);const[tx,ty]=pickTarget(aimed&&!deco,R);fws.push(makeFW(type,tx,ty,R,{deco}));}
function spawnChain(){
  const R=radiusFor('mini')*1.15;const[tx,ty]=pickTarget(true,R);const ang=rand(-0.6,0.6)+(Math.random()<0.5?0:Math.PI);const st=R*1.75;const col=pick(FW_COLORS);

}
function hazardCount(){let n=0;for(const f of fws)if(!f.deco&&(!f.burst||f.active))n++;return n;}
function director(dt){
  const t=elapsed;
  dir.itemNext-=dt;if(dir.itemNext<=0){dir.itemNext=rand(22,30);items.push({x:W+30,y:rand(L.playTop+H*0.05,L.playBottom-H*0.05),t:0});}
  if(t>=dir.finaleNext){dir.finale=5;dir.finaleNext+=30;ann={t:1.8,s:'피날레!!'};exciteBase=Math.min(1.6,exciteBase+0.1);}
  const hz=hazardCount();
  if(dir.finale>0){dir.finale-=dt;dir.finaleSpawn-=dt;if(dir.finaleSpawn<=0&&hz<9){dir.finaleSpawn=0.3;spawnAt('mini',Math.random()<0.35,false);}return;}
  dir.next-=dt;if(dir.next>0)return;
  const interval=t<20?1.25:t<45?1.05:Math.max(0.62,0.95-(t-45)*0.004);

  let type='peony';
  if(t>=45){const r=Math.random();type=r<0.45?'peony':r<0.65?'big':r<0.85?'chain':'ring';}
  else if(t>=30&&Math.random()<0.22)type='big';

  if(type==='chain')spawnChain();else spawnAt(type,aimed,false);

function attract(dt){dir.next-=dt;if(dir.next<=0){dir.next=rand(0.45,1.0);const r=Math.random();spawnAt(r<0.6?'peony':r<0.82?'big':'ring',false,true);}}
function onBurst(f){
  flash=Math.min(1.2,flash+0.45*(f.R/(H*0.1)));flashCol=f.col;excite=Math.min(2,excite+0.12);
  if(Math.random()<0.3&&texts.length<12)cheer(['와~','오오~','예쁘다!','와아!','우와~'],1,false);

}
function updateFireworks(dt){
  const br=birdR();
  for(let i=fws.length-1;i>=0;i--){
    const f=fws[i];f.t+=dt;f.x-=worldSpeed*dt;if(f.t<0)continue;
    const tA=f.tele+EXP+HOLD,tEnd=tA+FADE;
    if(!f.burst&&f.t>=f.tele){f.burst=true;onBurst(f);}
    if(f.burst){
      const e=f.t-f.tele;
      f.rc=e<EXP?f.R*easeOut(e/EXP):f.R;
      f.al=f.t<tA?1:Math.max(0,1-(f.t-tA)/FADE);
      f.active=f.t<tA;
      if(f.active&&!f.deco&&state==='play'&&!bird.dead){
        const d=Math.hypot(bird.x-f.x,bird.y-f.y);let hitc,nearc=false;
        if(f.type==='ring')hitc=Math.abs(d-f.rc)<f.band+br;
        else{hitc=d<f.rc+br;nearc=d<f.rc+br+H*0.055;}
        if(nearc&&e>=EXP*0.5)f.near=true;
        if(hitc){f.hitBird=true;if(bird.inv<=0)hitBird();}
      }
      if(!f.active&&!f.resolved){f.resolved=true;if(!f.deco&&f.near&&!f.hitBird&&state==='play'&&!bird.dead)nearMiss();}
    }

}

function endGame(){state='over';overT=0;const s=Math.floor(score);if(s>hi){hi=s;newRecord=true;try{localStorage.setItem('firebird_hi_v2',String(hi));}catch(e){}}}

/* ================= update ================= */
function update(dt){
  tG+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*2.2);if(hitFlash>0)hitFlash=Math.max(0,hitFlash-dt*1.8);
  flash=Math.max(0,flash-dt*2.4);excite+=(exciteBase-excite)*Math.min(1,dt*1.2);if(ann.t>0)ann.t-=dt;
  if(state==='play'){elapsed+=dt;worldSpeed=H*(0.15+Math.min(0.14,elapsed*0.0018));}else worldSpeed=H*0.12;
  offFar=(offFar+worldSpeed*0.25*dt)%FAR.w;offNear=(offNear+worldSpeed*0.5*dt)%NEAR.w;
  offF=(offF+worldSpeed*dt)%CROWD.front.PW;offB=(offB+worldSpeed*0.85*dt)%CROWD.back.PW;

  if(state==='play'){
    if(!bird.dead){
      director(dt);
      score+=dt*10*(1+elapsed/90);
      const sp=BIRDS[sel],vmax=sp.speed*H;let ix=keys.r-keys.l,iy=keys.d-keys.u;
      if(drag){const dx=drag.x-bird.x,dy=drag.y-bird.y,dl=Math.hypot(dx,dy);if(dl>2){const m=Math.min(1,dl/(H*0.05));ix=dx/dl*m;iy=dy/dl*m;}else{ix=0;iy=0;}}
      else{const l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l;}}
      const k=1-Math.exp(-dt*12);
      bird.vx+=(ix*vmax-bird.vx)*k;bird.vy+=(iy*vmax-bird.vy)*k;
      bird.x=clamp(bird.x+bird.vx*dt,W*0.05,W*0.62);bird.y=clamp(bird.y+bird.vy*dt,L.playTop,L.playBottom);
      bird.glide=iy>0.3;
      if(!bird.glide)bird.phase+=dt*sp.flap*(iy<-0.3?1.45:1)*Math.PI*2;
      bird.tilt+=(clamp(bird.vy/vmax*0.38,-0.38,0.42)-bird.tilt)*k;
      if(bird.inv>0)bird.inv-=dt;
      if(bird.hits>0){bird.puffT-=dt;if(bird.puffT<=0){bird.puffT=0.28/bird.hits;puffs.push({x:bird.x-birdR()*0.8,y:bird.y-birdR()*0.3,s:H*0.02,life:0.9,max:0.9});}}
      for(let i=items.length-1;i>=0;i--){const it=items[i];it.t+=dt;it.x-=worldSpeed*1.1*dt;const iyy=it.y+Math.sin(it.t*3)*H*0.02;
        if(Math.hypot(bird.x-it.x,bird.y-iyy)<birdR()+H*0.03){items.splice(i,1);if(bird.hits>0){bird.hits--;pops.push({s:'체력 회복!',x:bird.x,y:bird.y-H*0.06,life:1,max:1,col:'#8aff9a'});}else{score+=100;pops.push({s:'+100',x:bird.x,y:bird.y-H*0.06,life:0.9,max:0.9,col:'#8aff9a'});}continue;}
        if(it.x<-40)items.splice(i,1);}
    }else{
      deathT+=dt;bird.vy+=H*1.6*dt;bird.y+=bird.vy*dt;bird.x+=bird.vx*dt;bird.rot+=bird.spin*dt;
      bird.puffT-=dt;if(bird.puffT<=0&&!bird.hidden){bird.puffT=0.05;puffs.push({x:bird.x,y:bird.y,s:H*0.03,life:1,max:1});}
      if(!bird.hidden&&bird.y>H*0.9){bird.hidden=true;deathT=0;cheer(['브라보!!!','역대급!!!','앵콜!!!','와아아아!!!'],6,true);}
      if(bird.hidden&&deathT>1.1)endGame();
    }
  }else{attract(dt);if(state==='over')overT+=dt;}

  updateFireworks(dt);
  for(let i=fwSmoke.length-1;i>=0;i--){const s=fwSmoke[i];s.life-=dt;s.x-=worldSpeed*dt;s.y-=H*0.01*dt;s.s*=1+dt*0.15;if(s.life<=0)fwSmoke.splice(i,1);}
  for(let i=feathers.length-1;i>=0;i--){const p=feathers[i];p.life-=dt;p.vy+=H*0.5*dt;p.vx*=1-dt*1.5;p.x+=p.vx*dt+Math.sin(p.life*6)*H*0.03*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;if(p.life<=0)feathers.splice(i,1);}
  for(let i=puffs.length-1;i>=0;i--){const p=puffs[i];p.life-=dt;p.x-=worldSpeed*0.6*dt;p.y-=H*0.05*dt;p.s+=H*0.03*dt;if(p.life<=0)puffs.splice(i,1);}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.life-=dt;t.y+=t.vy*dt;t.vy*=1-dt*1.2;if(t.life<=0)texts.splice(i,1);}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.life-=dt;p.y-=H*0.05*dt;if(p.life<=0)pops.splice(i,1);}
  for(let i=cams.length-1;i>=0;i--){cams[i].life-=dt;if(cams[i].life<=0)cams.splice(i,1);}
}

/* ================= render ================= */
function drawCity(){
  const fy=L.cityBase-FAR.h+H*0.01,ny=L.cityBase-NEAR.h+H*0.02;
  ctx.drawImage(FAR.c,-offFar,fy,FAR.w,FAR.h);ctx.drawImage(FAR.c,-offFar+FAR.w,fy,FAR.w,FAR.h);
  ctx.drawImage(NEAR.c,-offNear,ny,NEAR.w,NEAR.h);ctx.drawImage(NEAR.c,-offNear+NEAR.w,ny,NEAR.w,NEAR.h);
}
function drawFireworks(){
  for(const f of fws){
    if(f.t<0||f.burst||f.deco)continue;
    const q=f.t/f.tele,lw=Math.max(1.5,H*0.0028);
    ctx.fillStyle=rgba(f.col,0.04+0.06*q);ctx.beginPath();ctx.arc(f.x,f.y,f.R,0,7);ctx.fill();
    ctx.setLineDash([H*0.012,H*0.009]);ctx.lineDashOffset=-tG*40;
    ctx.strokeStyle=rgba(f.col,0.4+0.25*Math.sin(tG*16));ctx.lineWidth=f.type==='ring'?lw*1.4:lw;
    ctx.beginPath();ctx.arc(f.x,f.y,f.R,0,7);ctx.stroke();ctx.setLineDash([]);
    if(f.type==='ring'){ctx.strokeStyle=rgba(f.col,0.12);ctx.lineWidth=f.band*2;ctx.beginPath();ctx.arc(f.x,f.y,f.R,0,7);ctx.stroke();}
    ctx.strokeStyle=rgba(f.col,0.15+0.55*q);ctx.lineWidth=lw;ctx.beginPath();ctx.arc(f.x,f.y,f.R*(1+1.4*(1-q)),0,7);ctx.stroke();
  }
  ctx.globalCompositeOperation='lighter';
  for(const f of fws){
    if(f.t<0)continue;
    if(!f.burst){
      const q=f.t/f.tele,e=1-(1-q)*(1-q),ry=f.launchY+(f.y-f.launchY)*e;
      for(let k=6;k>=1;k--){const qk=Math.max(0,q-k*0.03),ek=1-(1-qk)*(1-qk);glow(GLOW['#ffcf3f'],f.x+Math.sin(k*1.7+f.t*20)*H*0.003,f.launchY+(f.y-f.launchY)*ek,H*0.018*(1-k*0.1),0.5*(1-k/7));}
      glow(GLOW['#ffffff'],f.x,ry,H*0.03,1);continue;
    }
    const e=f.t-f.tele,al=f.al,fading=f.t>f.tele+EXP+HOLD;
    if(e<0.15)glow(GLOW['#ffffff'],f.x,f.y,f.R*1.4*(1-e/0.15)+H*0.02,1);

    if(e.code==='ArrowRight'||k==='d'){sel=(sel+1)%3;e.preventDefault();return;}
    if(k==='1'||k==='2'||k==='3'){sel=+k-1;return;}
    if(e.code==='Space'||e.code==='Enter'){e.preventDefault();startGame();return;}
  }else if(state==='over'){
    if(k==='b'||e.code==='Escape'){toTitle();return;}
    if((e.code==='Space'||e.code==='Enter')&&overT>0.8){e.preventDefault();startGame();return;}
  }
  if(setKey(e,1))e.preventDefault();
  if(e.code==='Space')e.preventDefault();
},{passive:false});
window.addEventListener('keyup',e=>{setKey(e,0);});
window.addEventListener('blur',()=>{keys.u=keys.d=keys.l=keys.r=0;});
function ptr(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
const inR=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();focusCanvas();const p=ptr(e);
  if(state==='title'){const rs=cardRects();for(let i=0;i<3;i++)if(inR(p,rs[i])){if(sel===i)startGame();else sel=i;return;}if(inR(p,startRect()))startGame();return;}
  if(state==='over'){if(inR(p,changeRect())){toTitle();return;}if(overT>0.8)startGame();return;}
  if(state==='play'){const off=e.pointerType==='touch'?H*0.07:0;drag={x:p.x,y:p.y-off,off};try{cv.setPointerCapture(e.pointerId);}catch(_){}}
});
cv.addEventListener('pointermove',e=>{if(drag){const p=ptr(e);drag.x=p.x;drag.y=p.y-drag.off;}});
window.addEventListener('pointerup',()=>{drag=null;});
window.addEventListener('pointercancel',()=>{drag=null;});

/* ================= loop ================= */
let last=0,rT=0;
window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(resize,120);});
function loop(ts){
  const dt=last?Math.min(0.033,(ts-last)/1000):0.016;last=ts;
  update(dt);render();requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);
})();
</script>
</body>
